# Use-case manifest for vesting
#
# Schema reference: frameworks/SCHEMA.md.
#
# Historical note: vesting/offchain/meshjs/ ships no deno.json, so before
# manifests existed it was invisible to the file-pattern discovery. The
# manifest now declares it explicitly.

use_case: vesting
description: >-
  A linear time-locked vesting contract: a beneficiary receives funds over a
  schedule, with the contract enforcing the cliff and release rules.

onchain:
  aiken:
    path: onchain/aiken

offchain:
  meshjs:
    path: offchain/meshjs
    entry: vesting.ts
