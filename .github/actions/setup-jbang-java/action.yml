name: 'Setup JBang + Java'
description: 'Set up the JDK and restore (or install) JBang.'

inputs:
  jdk-version:
    description: 'JDK major version (Temurin distribution).'
    required: false
    default: '24'
  cache-version:
    description: 'Cache-buster suffix.'
    required: false
    default: 'v1'

runs:
  using: composite
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.jdk-version }}

    - name: Restore JBang from cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.jbang
        key: jbang-${{ inputs.cache-version }}-${{ runner.os }}

    - name: Install JBang
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -Ls https://sh.jbang.dev | bash -s - app setup
        "$HOME/.jbang/bin/jbang" version

    - name: Add JBang to PATH
      shell: bash
      run: echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"
