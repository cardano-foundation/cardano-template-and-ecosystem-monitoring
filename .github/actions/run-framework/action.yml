name: Run framework cell
description: >-
  Runs one (use case, framework) cell using the framework registry. Reads
  frameworks/<framework>.yml for cwd_relative_to_example, run.command,
  default_entry, and result.convention; reads <use-case>/example.yml for
  the explicit entry under <kind>.<manifest_key>.entry; runs the descriptor's
  command from the resolved working directory; captures log + result.json.
  Thin wrapper around scripts/ci/run-cell.sh — the script does the work, the
  action gives callers a stable input shape.

inputs:
  framework:
    description: Framework name (matches frameworks/<name>.yml stem).
    required: true
  use_case:
    description: Use case directory name (e.g. "escrow").
    required: true
  output_dir:
    description: Directory to write result.json and log into. Created if missing.
    required: false
    default: .ci-results

outputs:
  status:
    description: pass | fail.
    value: ${{ steps.run.outputs.status }}
  result_path:
    description: Path to the canonical result.json.
    value: ${{ steps.run.outputs.result_path }}

runs:
  using: composite
  steps:
    - name: Run cell via descriptor
      id: run
      shell: bash
      env:
        USE_CASE: ${{ inputs.use_case }}
        FRAMEWORK: ${{ inputs.framework }}
        OUT_DIR: ${{ inputs.output_dir }}
      run: |
        set -uo pipefail
        chmod +x scripts/ci/run-cell.sh
        # The script reads PROTOCOL_VERSION_VERSION from env (set by load-versions).
        if scripts/ci/run-cell.sh "$USE_CASE" "$FRAMEWORK" "$OUT_DIR"; then
          STATUS=pass
        else
          STATUS=fail
        fi
        RESULT="${OUT_DIR}/${USE_CASE}__${FRAMEWORK}.result.json"
        echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
        echo "result_path=${RESULT}" >> "$GITHUB_OUTPUT"
