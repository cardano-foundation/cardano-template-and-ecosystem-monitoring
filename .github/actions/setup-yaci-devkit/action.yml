name: 'Setup Yaci DevKit'
description: 'Install (or restore from cache) yaci-devkit; optionally boot it and
  wait for the Blockfrost-compatible API on :8080.'

inputs:
  cache-version:
    description: 'Cache-buster suffix.'
    required: false
    default: 'v1'
  node-version:
    description: 'Node.js version used to install/run yaci-devkit.'
    required: false
    default: '20'
  start:
    description: 'Boot yaci-devkit after install and wait for readiness (true|false).'
    required: false
    default: 'true'
  ready-port:
    description: 'TCP port to poll for readiness when start=true.'
    required: false
    default: '8080'
  ready-timeout-tries:
    description: 'Number of 5-second poll attempts while waiting for readiness.'
    required: false
    default: '60'
  ready-min-block-height:
    description: 'Minimum block height required before declaring readiness. Ensures
      the chain has advanced past genesis so funder UTxOs and chain time are usable.'
    required: false
    default: '2'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore Yaci DevKit from cache
      id: cache
      uses: actions/cache@v4
      with:
        # User-level npm prefix avoids the /usr/local sudo dance.
        path: ~/.npm-global
        key: yaci-devkit-${{ inputs.cache-version }}-${{ runner.os }}-node${{ inputs.node-version }}

    - name: Install Yaci DevKit
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.npm-global"
        npm config set prefix "$HOME/.npm-global"
        npm install -g @bloxbean/yaci-devkit
        ls "$HOME/.npm-global/bin"

    - name: Add Yaci DevKit to PATH
      shell: bash
      run: echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

    - name: Start Yaci DevKit
      if: inputs.start == 'true'
      shell: bash
      run: |
        nohup "$HOME/.npm-global/bin/yaci-devkit" up --enable-yaci-store > yaci-devkit.log 2>&1 &

    - name: Wait for Yaci DevKit
      if: inputs.start == 'true'
      shell: bash
      env:
        PORT: ${{ inputs.ready-port }}
        TRIES: ${{ inputs.ready-timeout-tries }}
        MIN_HEIGHT: ${{ inputs.ready-min-block-height }}
      run: |
        # Readiness has three phases. A bare TCP check is not enough: yaci-devkit
        # opens :8080 well before yaci-store has indexed protocol params and
        # before the chain has produced its first non-genesis block. Off-chain
        # tests then hit half-populated endpoints — protocol params with null
        # fields (BigInt(undefined) crash), empty funder UTxO sets
        # (InputSelectionError), or stale chain time (Plutus validity-range
        # failures). Each phase below maps to one of those observed failure
        # modes; bypassing any of them re-introduces the flake.
        API="http://localhost:${PORT}/api/v1"

        echo "── Phase 1: TCP socket on :${PORT} ──"
        for i in $(seq 1 "$TRIES"); do
          if nc -z localhost "$PORT"; then
            echo "TCP open after ${i} poll(s)"
            break
          fi
          if [ "$i" -eq "$TRIES" ]; then
            echo "❌ TCP socket never opened"
            tail -100 yaci-devkit.log || true
            exit 1
          fi
          sleep 5
        done

        echo "── Phase 2: chain producing blocks (height ≥ ${MIN_HEIGHT}) ──"
        for i in $(seq 1 "$TRIES"); do
          BODY=$(curl -fsS "${API}/blocks/latest" 2>/dev/null || true)
          HEIGHT=$(printf '%s' "$BODY" | jq -r '.height // 0' 2>/dev/null || echo 0)
          if [ -n "$HEIGHT" ] && [ "$HEIGHT" -ge "$MIN_HEIGHT" ] 2>/dev/null; then
            echo "Chain at height ${HEIGHT} after ${i} poll(s)"
            break
          fi
          if [ "$i" -eq "$TRIES" ]; then
            echo "❌ Chain never reached height ${MIN_HEIGHT}. Last body: ${BODY}"
            tail -100 yaci-devkit.log || true
            exit 1
          fi
          sleep 5
        done

        echo "── Phase 3: protocol parameters fully populated ──"
        # key_deposit is the field that has caused the Evolution SDK BigInt
        # crash. If it's present and numeric, the rest of the param block has
        # been indexed too.
        for i in $(seq 1 "$TRIES"); do
          BODY=$(curl -fsS "${API}/epochs/latest/parameters" 2>/dev/null || true)
          KD=$(printf '%s' "$BODY" | jq -r '.key_deposit // empty' 2>/dev/null || true)
          if [ -n "$KD" ] && [ "$KD" != "null" ]; then
            echo "Protocol params indexed (key_deposit=${KD}) after ${i} poll(s)"
            echo "✅ Yaci DevKit fully ready"
            exit 0
          fi
          if [ "$i" -eq "$TRIES" ]; then
            echo "❌ Protocol params never populated. Last body: ${BODY}"
            tail -100 yaci-devkit.log || true
            exit 1
          fi
          sleep 5
        done
