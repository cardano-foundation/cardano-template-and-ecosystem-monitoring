name: Compile Scalus (reusable)

# Reusable workflow: compiles every example's `onchain/scalus` project with
# SBT, runs `sbt run` to produce plutus.json, and uploads each result as
# the artifact `plutus-scalus-<example>` consumed by cross-check test jobs.
#
# Convention: each Scalus example's build.sbt must set:
#   Compile / mainClass := Some("<fully.qualified.GeneratePlutus>")
# Running `sbt run` from the example's onchain/scalus directory must write
# plutus.json to the current directory.

on:
  workflow_call:
    inputs:
      examples:
        description: 'JSON array of example names with an onchain/scalus project.'
        type: string
        required: true
      java-version:
        description: 'JDK major version used to compile Scalus.'
        type: string
        required: false
        default: '21'
      cache-version:
        description: 'Cache-buster forwarded to setup-sbt.'
        type: string
        required: false
        default: 'v1'

jobs:
  compile:
    name: Compile Scalus - ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SBT
        uses: ./.github/actions/setup-sbt
        with:
          java-version: ${{ inputs.java-version }}
          cache-version: ${{ inputs.cache-version }}

      - name: Cache SBT target directories
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.example }}/onchain/scalus/target
            ${{ matrix.example }}/onchain/scalus/project/target
          key: sbt-target-${{ matrix.example }}-${{ hashFiles(format('{0}/onchain/scalus/build.sbt', matrix.example)) }}-${{ inputs.cache-version }}

      - name: Compile and generate plutus.json
        working-directory: ${{ matrix.example }}/onchain/scalus
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          sbt compile
          sbt run
          if [ ! -f "plutus.json" ]; then
            echo "::error::plutus.json not generated for $EXAMPLE — ensure build.sbt sets Compile/mainClass and the main writes plutus.json to the working directory"
            exit 1
          fi
          echo "plutus.json generated ($(wc -c < plutus.json) bytes)"

      - name: Upload plutus.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: plutus-scalus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/scalus/plutus.json
          retention-days: 1