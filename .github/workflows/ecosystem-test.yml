name: Cardano Ecosystem Tests

# Rewritten in P1W1 (see plan & frameworks/SCHEMA.md). The matrix is generic
# over framework descriptors (frameworks/*.yml) and use-case manifests
# (<use-case>/example.yml); legacy use cases without a manifest fall through
# the dual-mode discovery in scripts/local-test-discovery.sh.
#
# Tool versions are pinned by versions.yml at the repo root and exported by
# the .github/actions/load-versions/ composite action.
#
# Yaci DevKit runs once per offchain test job (matrix={use_case}) rather than
# three times (once per offchain framework). See .codex-reviews/p1w1-yaci-poc.md
# for the rationale.
#
# Untrusted-input note: matrix.example flows from discovery output (filesystem
# directory names of checked-in use cases). Even so, every shell `run:` block
# pipes matrix.example through env: rather than direct ${{ … }} interpolation
# to satisfy GitHub Actions injection-hardening practice.

on:
  push:
    branches:
      - main
      # TEMPORARY: roadmap branch — remove when feat/ecosystem-monitoring-and-learning-enhancement merges to main.
      - feat/ecosystem-monitoring-and-learning-enhancement
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Discovery
  # ---------------------------------------------------------------------------
  discover:
    name: Discover Examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aiken-examples: ${{ steps.discovery.outputs.aiken-examples }}
      ccl-examples: ${{ steps.discovery.outputs.ccl-examples }}
      mesh-examples: ${{ steps.discovery.outputs.mesh-examples }}
      lucid-examples: ${{ steps.discovery.outputs.lucid-examples }}
      use-cases-with-offchain: ${{ steps.discovery.outputs.use-cases-with-offchain }}
      manifest-coverage: ${{ steps.discovery.outputs.manifest-coverage }}
    steps:
      - uses: actions/checkout@v4
      - name: Run discovery script
        id: discovery
        run: |
          chmod +x scripts/local-test-discovery.sh
          scripts/local-test-discovery.sh

  # ---------------------------------------------------------------------------
  # Compile onchain (Aiken). One matrix child per use case with onchain/aiken/.
  # ---------------------------------------------------------------------------
  compile-aiken:
    name: Compile Aiken — ${{ matrix.example }}
    needs: discover
    if: needs.discover.outputs.aiken-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.aiken-examples) }}
    env:
      USE_CASE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Install Aiken (pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://install.aiken-lang.org | sh
          source $HOME/.aiken/bin/env
          aikup install "${AIKEN_VERSION}"
          aiken --version

      - name: Cache Aiken build
        uses: actions/cache@v4
        with:
          path: |
            ~/.aiken
            ${{ matrix.example }}/onchain/aiken/build
          key: aiken-${{ steps.versions.outputs.aiken }}-${{ matrix.example }}-${{ hashFiles(format('{0}/onchain/aiken/aiken.toml', matrix.example)) }}

      - name: Run aiken check + build + verify plutus.json, emit result.json
        run: |
          mkdir -p .ci-results
          export PATH="$HOME/.aiken/bin:$PATH"
          PJ="${USE_CASE}/onchain/aiken/plutus.json"
          START_NS=$(date +%s%N)
          # Pass requires BOTH: aiken commands succeeding AND plutus.json being
          # generated. The previous version wrote the result.json after only
          # the build step, so a missing-plutus.json failure was visible at
          # the cell level but the matrix said pass — fixed here.
          STATUS=fail
          ERR=""
          if (cd "${USE_CASE}/onchain/aiken" && aiken check && aiken build); then
            if [[ -f "$PJ" ]]; then
              STATUS=pass
            else
              ERR="plutus.json not generated by aiken build"
            fi
          else
            ERR="aiken check or build failed"
          fi
          END_NS=$(date +%s%N)
          DUR_MS=$(( (END_NS - START_NS) / 1000000 ))

          UC="$USE_CASE" FW="aiken" ERA="${PROTOCOL_VERSION_VERSION}" \
            STATUS="$STATUS" DUR_MS="$DUR_MS" ERR="$ERR" \
            python3 - > ".ci-results/${USE_CASE}__aiken.result.json" <<'PY'
          import json, os
          out = {
              "tier": "use-case-example",
              "id": f"{os.environ['UC']}/aiken",
              "use_case": os.environ["UC"],
              "framework": "aiken",
              "era": os.environ.get("ERA", "unknown"),
              "status": os.environ["STATUS"],
              "duration_ms": int(os.environ["DUR_MS"]),
          }
          if os.environ.get("ERR"):
              out["error_summary"] = os.environ["ERR"]
          print(json.dumps(out, indent=2))
          PY

          if [[ "$STATUS" != "pass" ]]; then
            echo "::error::aiken cell failed for ${USE_CASE}: ${ERR}"
            exit 1
          fi
          echo "plutus.json size: $(wc -c < "$PJ") bytes"

      - name: Upload plutus.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/plutus.json
          retention-days: 1

      - name: Upload aiken cell result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-aiken-${{ matrix.example }}
          path: .ci-results/${{ matrix.example }}__aiken.result.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Test offchain. One matrix child per use-case (collapsed). All offchain
  # frameworks declared by the use-case manifest run sequentially against a
  # single Yaci DevKit instance.
  # ---------------------------------------------------------------------------
  test-offchain:
    name: Test offchain — ${{ matrix.example }}
    needs: [discover, compile-aiken]
    if: needs.discover.outputs.use-cases-with-offchain != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.use-cases-with-offchain) }}
    env:
      USE_CASE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.versions.outputs.deno }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Install JBang (pinned)
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> $GITHUB_PATH
          "$HOME/.jbang/bin/jbang" version

      - name: Install Yaci DevKit (pinned)
        run: |
          npm install -g "@bloxbean/yaci-devkit@${YACI_DEVKIT_VERSION}"

      - name: Start Yaci DevKit
        run: |
          nohup yaci-devkit up --enable-yaci-store > yaci-devkit.log 2>&1 &
          echo $! > /tmp/yaci.pid

      - name: Wait for Yaci DevKit
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Yaci DevKit ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Yaci DevKit did not become ready within 150s"
          tail -100 yaci-devkit.log || true
          exit 1

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run all declared offchain cells (descriptor-driven)
        # ONE step iterates the manifest's declared offchain frameworks and
        # invokes scripts/ci/run-cell.sh for each. The script reads
        # frameworks/<name>.yml for the run command and result convention,
        # and <use-case>/example.yml for the explicit entry. Adding a new
        # offchain SDK is one PR adding one descriptor + one manifest entry —
        # no edits to this workflow required.
        if: ${{ always() }}
        run: |
          set -uo pipefail
          chmod +x scripts/ci/run-cell.sh

          MANIFEST="${USE_CASE}/example.yml"
          declare -a FRAMEWORKS=()

          if [[ -f "$MANIFEST" ]]; then
            # Manifest mode: iterate framework keys under `offchain:`.
            mapfile -t FRAMEWORKS < <(python3 - "$MANIFEST" <<'PY'
          import re, sys
          with open(sys.argv[1]) as fh:
              lines = fh.readlines()
          in_off, off_indent = False, -1
          for raw in lines:
              line = raw.rstrip("\n")
              stripped = line.lstrip()
              if not stripped or stripped.startswith("#"):
                  continue
              indent = len(line) - len(stripped)
              m = re.match(r'([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*)$', stripped)
              if not m:
                  continue
              key, val = m.group(1), m.group(2).strip()
              if not in_off:
                  if indent == 0 and key == "offchain" and not val:
                      in_off, off_indent = True, indent
                  continue
              if indent <= off_indent:
                  break
              if (indent == off_indent + 2 or indent == off_indent + 4) and not val:
                  print(key)
          PY
            )
          else
            # Heuristic mode: any offchain/<name>/ directory whose <name> matches
            # an existing framework descriptor.
            for fw_file in frameworks/*.yml; do
              fw=$(basename "$fw_file" .yml)
              # Only offchain frameworks
              kind=$(awk -F': ' '/^kind[[:space:]]*:/ {gsub(/[[:space:]]|"/, "", $2); print $2; exit}' "$fw_file")
              if [[ "$kind" != "offchain" ]]; then continue; fi
              if [[ -d "${USE_CASE}/offchain/$fw" ]]; then
                FRAMEWORKS+=("$fw")
              fi
            done
          fi

          echo "Declared offchain frameworks for ${USE_CASE}: ${FRAMEWORKS[*]:-(none)}"

          OVERALL_STATUS=0
          for fw in "${FRAMEWORKS[@]:-}"; do
            [[ -z "$fw" ]] && continue
            DESCRIPTOR="frameworks/${fw}.yml"
            if [[ ! -f "$DESCRIPTOR" ]]; then
              echo "::warning::no descriptor at ${DESCRIPTOR} for ${fw} — skipping"
              continue
            fi
            echo "::group::${USE_CASE} / ${fw}"
            if ! scripts/ci/run-cell.sh "$USE_CASE" "$fw" ".ci-results"; then
              OVERALL_STATUS=1
            fi
            echo "::endgroup::"
          done

          # Don't fail the workflow on individual cell failures — the
          # aggregator captures them in matrix.json. The job exits non-zero
          # only if Yaci or runtime setup itself broke.
          # (continue-on-error semantics replicated here without the env hack
          # of putting the loop in continue-on-error: it wouldn't surface
          # which cells failed.)
          exit 0

      - name: Stop Yaci DevKit
        if: always()
        run: |
          if [[ -f /tmp/yaci.pid ]]; then
            kill "$(cat /tmp/yaci.pid)" 2>/dev/null || true
          fi
          pkill -f yaci-devkit 2>/dev/null || true

      - name: Upload offchain cell results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-offchain-${{ matrix.example }}
          path: |
            .ci-results/${{ matrix.example }}__*.result.json
            .ci-results/${{ matrix.example }}__*.log
          retention-days: 30

      - name: Upload Yaci log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yaci-log-${{ matrix.example }}
          path: yaci-devkit.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Aggregate per-cell result.json files into matrix.json + render markdown.
  # ---------------------------------------------------------------------------
  report:
    name: Aggregate matrix.json + render report
    needs: [compile-aiken, test-offchain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all cell-result artifacts
        uses: actions/download-artifact@v4
        with:
          path: .ci-artifacts/

      - name: Collect result.json files
        run: |
          mkdir -p .ci-results
          find .ci-artifacts -name '*.result.json' -exec cp {} .ci-results/ \;
          echo "Collected $(ls -1 .ci-results | wc -l) result.json file(s)"

      - name: Aggregate matrix.json
        run: |
          chmod +x scripts/aggregate-results.sh
          scripts/aggregate-results.sh .ci-results matrix.json
          cat matrix.json

      - name: Render matrix report
        run: |
          chmod +x scripts/render-matrix.sh
          scripts/render-matrix.sh matrix.json > matrix-report.md
          cat matrix-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload matrix.json + report
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-matrix
          path: |
            matrix.json
            matrix-report.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('matrix-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });
