name: Cardano Ecosystem CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Toolchain versions and a global cache-buster.
# Bumping CACHE_VERSION invalidates every prepare-* cache in one shot — useful
# when a transitive download (e.g. a yaci-devkit node binary) changes outside
# the pinned npm version.
env:
  AIKEN_VERSION: v1.1.21
  JDK_VERSION: '24'
  NODE_VERSION: '20'
  CACHE_VERSION: v1

jobs:
  discover:
    name: Discover Examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aiken-examples: ${{ steps.discovery.outputs.aiken-examples }}
      ccl-examples: ${{ steps.discovery.outputs.ccl-examples }}
      mesh-examples: ${{ steps.discovery.outputs.mesh-examples }}
      evosdk-examples: ${{ steps.discovery.outputs.evosdk-examples }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run discovery script
        id: discovery
        run: |
          chmod +x scripts/local-test-discovery.sh
          scripts/local-test-discovery.sh

  # ─────────────────────────────────────────────────────────────────────────
  # PREPARE-* JOBS
  #
  # Each prepare-* job installs a toolchain *once* per workflow run and saves
  # it to actions/cache. The downstream matrix jobs (compile-aiken,
  # test-ccl-java, test-mesh, test-evolutionsdk) restore that cache instead
  # of re-installing from scratch on every matrix entry.
  #
  # Cache keys are derived from the pinned tool version + CACHE_VERSION, so:
  #   - First run on a new tool version: prepare-* pays the install cost
  #     once; every matrix entry restores the warm cache from the same run.
  #   - Later runs: prepare-* is itself a cache hit (~5s).
  #   - Bumping CACHE_VERSION invalidates everything in one step.
  # ─────────────────────────────────────────────────────────────────────────

  prepare-aiken:
    name: Prepare Aiken toolchain
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore Aiken from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.aiken
          key: aiken-${{ env.AIKEN_VERSION }}-${{ env.CACHE_VERSION }}-${{ runner.os }}

      - name: Install Aiken
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://install.aiken-lang.org | sh
          export PATH="$HOME/.aiken/bin:$PATH"
          aikup install "${AIKEN_VERSION#v}"
          aiken --version

  prepare-jbang:
    name: Prepare JBang toolchain
    needs: discover
    if: needs.discover.outputs.ccl-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore JBang from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.jbang
          key: jbang-${{ env.CACHE_VERSION }}-${{ runner.os }}

      - name: Install JBang
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          "$HOME/.jbang/bin/jbang" version

  prepare-yaci-devkit:
    name: Prepare Yaci DevKit
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Yaci DevKit from cache
        id: cache
        uses: actions/cache@v4
        with:
          # User-level prefix avoids the /usr/local sudo dance.
          path: ~/.npm-global
          key: yaci-devkit-${{ env.CACHE_VERSION }}-${{ runner.os }}-node${{ env.NODE_VERSION }}

      - name: Install Yaci DevKit globally
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          npm install -g @bloxbean/yaci-devkit
          ls "$HOME/.npm-global/bin"

  compile-aiken:
    name: Compile Aiken - ${{ matrix.example }}
    needs: [discover, prepare-aiken]
    if: needs.discover.outputs.aiken-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.aiken-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Aiken toolchain
        uses: actions/cache@v4
        with:
          path: ~/.aiken
          key: aiken-${{ env.AIKEN_VERSION }}-${{ env.CACHE_VERSION }}-${{ runner.os }}

      - name: Add Aiken to PATH
        run: echo "$HOME/.aiken/bin" >> $GITHUB_PATH

      - name: Cache per-example Aiken build dir
        uses: actions/cache@v4
        with:
          path: ${{ matrix.example }}/onchain/aiken/build
          key: aiken-build-${{ matrix.example }}-${{ hashFiles(format('{0}/onchain/aiken/aiken.toml', matrix.example)) }}

      - name: Run aiken check and build
        working-directory: ${{ matrix.example }}/onchain/aiken
        run: |
          aiken --version
          aiken check
          aiken build

      - name: Verify plutus.json generated
        run: |
          if [ ! -f "${{ matrix.example }}/onchain/aiken/plutus.json" ]; then
            echo "❌ plutus.json not generated"
            exit 1
          fi
          echo "✅ plutus.json generated ($(wc -c < ${{ matrix.example }}/onchain/aiken/plutus.json) bytes)"

      - name: Upload plutus.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/plutus.json
          retention-days: 1

  test-ccl-java:
    name: Test CCL Java - ${{ matrix.example }}
    needs: [discover, compile-aiken, prepare-jbang, prepare-yaci-devkit]
    if: needs.discover.outputs.ccl-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.ccl-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}

      - name: Restore JBang toolchain
        uses: actions/cache@v4
        with:
          path: ~/.jbang
          key: jbang-${{ env.CACHE_VERSION }}-${{ runner.os }}

      - name: Add JBang to PATH
        run: |
          echo "$HOME/.jbang/bin" >> $GITHUB_PATH
          "$HOME/.jbang/bin/jbang" version

      - name: Cache JBang m2 deps per example
        uses: actions/cache@v4
        with:
          path: ~/.jbang/cache
          key: jbang-cache-${{ matrix.example }}-${{ hashFiles(format('{0}/offchain/ccl-java/*.java', matrix.example)) }}

      - name: Setup Node.js (for Yaci DevKit)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Yaci DevKit toolchain
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: yaci-devkit-${{ env.CACHE_VERSION }}-${{ runner.os }}-node${{ env.NODE_VERSION }}

      - name: Start Yaci DevKit
        run: |
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          nohup "$HOME/.npm-global/bin/yaci-devkit" up --enable-yaci-store > yaci-devkit.log 2>&1 &

      - name: Wait for Yaci DevKit
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "✅ Yaci DevKit ready"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run CCL Java test
        working-directory: ${{ matrix.example }}/offchain/ccl-java
        run: |
          JAVA_FILE=$(ls *.java | head -1)
          echo "Running: jbang $JAVA_FILE"
          set +e
          timeout 300 jbang "$JAVA_FILE" 2>&1 | tee test-output.log
          EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT" -eq 0 ]; then echo "success" > test-status.txt; else echo "failed" > test-status.txt; fi
          exit "$EXIT"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ccl-${{ matrix.example }}
          path: |
            ${{ matrix.example }}/offchain/ccl-java/test-output.log
            ${{ matrix.example }}/offchain/ccl-java/test-status.txt
          retention-days: 30

  test-mesh:
    name: Test Mesh.js - ${{ matrix.example }}
    needs: [discover, compile-aiken, prepare-yaci-devkit]
    if: needs.discover.outputs.mesh-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.mesh-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ matrix.example }}-${{ hashFiles(format('{0}/offchain/meshjs/deno.json', matrix.example)) }}

      - name: Setup Node.js (for Yaci DevKit)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Yaci DevKit toolchain
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: yaci-devkit-${{ env.CACHE_VERSION }}-${{ runner.os }}-node${{ env.NODE_VERSION }}

      - name: Start Yaci DevKit
        run: |
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          nohup "$HOME/.npm-global/bin/yaci-devkit" up --enable-yaci-store > yaci-devkit.log 2>&1 &

      - name: Wait for Yaci DevKit
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "✅ Yaci DevKit ready"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run Mesh.js test
        working-directory: ${{ matrix.example }}/offchain/meshjs
        run: |
          TS_FILE=$(ls *.ts | head -1)
          echo "Running: deno run --allow-all $TS_FILE"
          set +e
          timeout 300 deno run --allow-all "$TS_FILE" 2>&1 | tee test-output.log
          EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT" -eq 0 ]; then echo "success" > test-status.txt; else echo "failed" > test-status.txt; fi
          exit "$EXIT"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-mesh-${{ matrix.example }}
          path: |
            ${{ matrix.example }}/offchain/meshjs/test-output.log
            ${{ matrix.example }}/offchain/meshjs/test-status.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # ADDING A NEW FRAMEWORK
  #
  # The discovery script, dashboard generator, and dashboard HTML all read
  # `frameworks.json` and add a new framework automatically. The CI workflow
  # needs two pieces wired in: a prepare-* job (install + cache) and a
  # test-* job (matrix, restore cache, run).
  #
  #   1. Add an entry to `frameworks.json` at the repo root:
  #        { "id": "<id>", "label": "<Display Name>",
  #          "kind": "onchain"|"offchain",
  #          "discoveryPath": "onchain/<id>/<manifest>"  (or offchain/...),
  #          "statusPrefix": "<short-prefix>" }
  #      Discovery + dashboard pick it up immediately.
  #
  #   2. Add a `prepare-<tool>` job (if your toolchain isn't already prepared
  #      above). Pattern:
  #        - `needs: discover` so it can short-circuit when no examples use it
  #        - actions/cache keyed by tool version + CACHE_VERSION + runner.os
  #        - skip the install step when the cache hits
  #
  #   3. Copy one of the test-* jobs above (or compile-aiken for an on-chain
  #      compile job) as a template, then change:
  #        - The job name → `test-<id>` or `compile-<id>`
  #        - `needs:` → add the prepare-* job(s) you depend on
  #        - `matrix.example: ${{ fromJson(needs.discover.outputs.<prefix>-examples) }}`
  #        - The `if:` guard → `needs.discover.outputs.<prefix>-examples != '[]'`
  #        - Replace the "Install …" step with a cache restore using the same
  #          key as the prepare-* job, then a small step to add it to PATH
  #        - `working-directory` and the run command
  #        - The artifact name → `logs-<prefix>-${{ matrix.example }}`
  #        - The path globs to your test-output.log + test-status.txt
  #
  #   4. (Optional) If your framework introduces new pinned libraries, add
  #      them to `versions.json` and a section in `scripts/sync-versions.sh`
  #      and `scripts/check-library-versions.sh`.
  #
  # The reconstruct-status step in `report-and-dashboard` is already generic
  # (it scans every `logs-*` artifact), so no changes are needed there.
  # ─────────────────────────────────────────────────────────────────────────

  test-evolutionsdk:
    name: Test Evolution SDK - ${{ matrix.example }}
    needs: [discover, compile-aiken, prepare-yaci-devkit]
    if: needs.discover.outputs.evosdk-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.evosdk-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ matrix.example }}-${{ hashFiles(format('{0}/offchain/evolutionsdk/deno.json', matrix.example)) }}

      - name: Setup Node.js (for Yaci DevKit)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Yaci DevKit toolchain
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: yaci-devkit-${{ env.CACHE_VERSION }}-${{ runner.os }}-node${{ env.NODE_VERSION }}

      - name: Start Yaci DevKit
        run: |
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          nohup "$HOME/.npm-global/bin/yaci-devkit" up --enable-yaci-store > yaci-devkit.log 2>&1 &

      - name: Wait for Yaci DevKit
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "✅ Yaci DevKit ready"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run Evolution SDK test
        working-directory: ${{ matrix.example }}/offchain/evolutionsdk
        run: |
          TS_FILE=$(ls *.ts | head -1)
          echo "Running: deno run --allow-all $TS_FILE"
          set +e
          timeout 300 deno run --allow-all "$TS_FILE" 2>&1 | tee test-output.log
          EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT" -eq 0 ]; then echo "success" > test-status.txt; else echo "failed" > test-status.txt; fi
          exit "$EXIT"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-evosdk-${{ matrix.example }}
          path: |
            ${{ matrix.example }}/offchain/evolutionsdk/test-output.log
            ${{ matrix.example }}/offchain/evolutionsdk/test-status.txt
          retention-days: 30

  report-and-dashboard:
    name: Report & Dashboard
    needs: [compile-aiken, test-ccl-java, test-mesh, test-evolutionsdk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Reconstruct status files from artifacts
        run: |
          mkdir -p .local-test-results

          for d in artifacts/plutus-*/; do
            [ -d "$d" ] || continue
            example=$(basename "$d" | sed 's/^plutus-//')
            if [ -f "$d/plutus.json" ]; then
              echo "success" > ".local-test-results/aiken-${example}-status.txt"
            else
              echo "failed" > ".local-test-results/aiken-${example}-status.txt"
            fi
          done

          # Helper: prefer test-status.txt (written by the test step from actual exit code).
          # Fall back to grepping the log if status file is missing (e.g., step failed
          # before writing it, or older artifacts from before this convention).
          resolve_status() {
            local prefix="$1" log_pattern="$2"
            for d in artifacts/logs-${prefix}-*/; do
              [ -d "$d" ] || continue
              local example=$(basename "$d" | sed "s/^logs-${prefix}-//")
              local out=".local-test-results/${prefix}-${example}-status.txt"
              if [ -f "$d/test-status.txt" ]; then
                cp "$d/test-status.txt" "$out"
              elif [ -f "$d/test-output.log" ] && grep -qE "$log_pattern" "$d/test-output.log" 2>/dev/null; then
                echo "failed" > "$out"
              elif [ -f "$d/test-output.log" ]; then
                echo "success" > "$out"
              else
                echo "failed" > "$out"
              fi
            done
          }

          resolve_status ccl    "AssertionError|BUILD FAILED|Exception in thread"
          resolve_status mesh   "Uncaught|AssertionError|TypeError:|ReferenceError:|SyntaxError:|^error:"
          resolve_status evosdk "Uncaught|AssertionError|TypeError:|ReferenceError:|SyntaxError:|^error:"

      - name: Generate markdown report
        run: |
          echo "# Cardano Ecosystem Test Report" > report.md
          echo "" >> report.md
          echo "**Generated**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> report.md
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          echo "**Workflow Run**: https://github.com/${REPO}/actions/runs/${RUN_ID}" >> report.md
          echo "" >> report.md
          echo "## Summary" >> report.md
          echo "" >> report.md
          AIKEN_COUNT=$(find artifacts -name "plutus-*" -type d 2>/dev/null | wc -l)
          CCL_COUNT=$(find artifacts -name "logs-ccl-*" -type d 2>/dev/null | wc -l)
          MESH_COUNT=$(find artifacts -name "logs-mesh-*" -type d 2>/dev/null | wc -l)
          EVOSDK_COUNT=$(find artifacts -name "logs-evosdk-*" -type d 2>/dev/null | wc -l)
          echo "- **Aiken Examples Compiled**: $AIKEN_COUNT" >> report.md
          echo "- **CCL Java Tests**: $CCL_COUNT" >> report.md
          echo "- **Mesh.js Tests**: $MESH_COUNT" >> report.md
          echo "- **Evolution SDK Tests**: $EVOSDK_COUNT" >> report.md
          echo "" >> report.md
          echo "All test logs and build artifacts are available in the workflow artifacts." >> report.md

      - name: Run version check
        run: bash scripts/check-library-versions.sh

      - name: Generate dashboard
        run: bash scripts/generate-dashboard.sh

      - name: Add report and version status to job summary
        if: always()
        run: |
          cat report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .local-test-results/version-report.md ]; then
            cat .local-test-results/version-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            report.md
            .local-test-results/version-report.json
            .local-test-results/version-report.md
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const versionReport = fs.existsSync('.local-test-results/version-report.md')
              ? '\n\n' + fs.readFileSync('.local-test-results/version-report.md', 'utf8')
              : '';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report + versionReport
            });

      - name: Commit dashboard.json
        if: github.event_name == 'schedule' || github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git add docs/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes to dashboard.json"
          else
            git commit -m "chore: update dashboard.json [skip ci]"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Update versions.json from upstream
        if: github.event_name == 'schedule' && env.VERSIONS_OUTDATED == 'true'
        run: |
          jq '.libraries | to_entries | map({key: .key, value: .value.latest}) | from_entries' \
            .local-test-results/version-report.json > versions.json.new
          mv versions.json.new versions.json
          echo "Updated versions.json:"
          cat versions.json

      - name: Apply version sync
        if: github.event_name == 'schedule' && env.VERSIONS_OUTDATED == 'true'
        run: bash scripts/sync-versions.sh

      - name: Create version-bump PR
        if: github.event_name == 'schedule' && env.VERSIONS_OUTDATED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/version-bump
          delete-branch: true
          title: "chore: update library versions to latest"
          labels: ${{ env.VERSION_BUMP_LABEL }}
          body: |
            ## Automated Version Bump

            The version check detected outdated libraries.
            This PR updates all dependency files to the latest versions.

            See the `reports` artifact from the workflow run for details.

            ---
            _Generated by the ecosystem CI workflow_
          commit-message: "chore: bump library versions to latest"
