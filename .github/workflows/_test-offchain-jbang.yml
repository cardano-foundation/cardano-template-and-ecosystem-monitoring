name: Test off-chain (JBang-based, reusable)

# Reusable workflow used by every JBang/JVM-based off-chain framework
# (CCL Java today). The caller supplies the framework id, the on-disk
# subdir, the matrix of examples, and the status prefix used for log
# artifacts.

on:
  workflow_call:
    inputs:
      framework-id:
        description: 'Identifier matching frameworks.json (e.g. ccl-java).'
        type: string
        required: true
      status-prefix:
        description: 'Short prefix used in the log/status artifact names (e.g. ccl).'
        type: string
        required: true
      subdir:
        description: 'Path under the example dir containing the .java entrypoint.'
        type: string
        required: true
      examples:
        description: 'JSON array of example names to run.'
        type: string
        required: true
      jdk-version:
        description: 'JDK major version.'
        type: string
        required: false
        default: '24'
      cache-version:
        description: 'Cache-buster forwarded to setup-* actions.'
        type: string
        required: false
        default: 'v1'

jobs:
  test:
    name: Test ${{ inputs.framework-id }} - ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JBang + Java
        uses: ./.github/actions/setup-jbang-java
        with:
          jdk-version: ${{ inputs.jdk-version }}
          cache-version: ${{ inputs.cache-version }}

      - name: Cache JBang m2 deps per example
        uses: actions/cache@v4
        with:
          path: ~/.jbang/cache
          key: jbang-cache-${{ matrix.example }}-${{ hashFiles(format('{0}/{1}/*.java', matrix.example, inputs.subdir)) }}

      - name: Setup Yaci DevKit
        uses: ./.github/actions/setup-yaci-devkit
        with:
          cache-version: ${{ inputs.cache-version }}

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run off-chain test
        working-directory: ${{ matrix.example }}/${{ inputs.subdir }}
        env:
          EXAMPLE: ${{ matrix.example }}
          SUBDIR: ${{ inputs.subdir }}
        run: |
          JAVA_FILE=$(ls *.java | head -1)
          echo "Running jbang on $EXAMPLE/$SUBDIR/$JAVA_FILE"
          set +e
          timeout 300 jbang "$JAVA_FILE" 2>&1 | tee test-output.log
          EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT" -eq 0 ]; then echo success > test-status.txt; else echo failed > test-status.txt; fi
          exit "$EXIT"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.status-prefix }}-${{ matrix.example }}
          path: |
            ${{ matrix.example }}/${{ inputs.subdir }}/test-output.log
            ${{ matrix.example }}/${{ inputs.subdir }}/test-status.txt
          retention-days: 30
