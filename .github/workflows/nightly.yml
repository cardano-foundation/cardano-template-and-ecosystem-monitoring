name: Nightly Ecosystem Health Check

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC daily
  workflow_dispatch:       # allow manual trigger
  pull_request:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aiken-examples: ${{ steps.discovery.outputs.aiken-examples }}
      ccl-examples: ${{ steps.discovery.outputs.ccl-examples }}
      mesh-examples: ${{ steps.discovery.outputs.mesh-examples }}
      lucid-examples: ${{ steps.discovery.outputs.lucid-examples }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run discovery script
        id: discovery
        run: |
          chmod +x scripts/local-test-discovery.sh
          scripts/local-test-discovery.sh

  compile-aiken:
    name: Compile Aiken - ${{ matrix.example }}
    needs: discover
    if: needs.discover.outputs.aiken-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.aiken-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Aiken
        run: |
          # Install aikup and aiken
          curl --proto '=https' --tlsv1.2 -LsSf https://install.aiken-lang.org | sh
          # Source the environment to add aiken to PATH
          source $HOME/.aiken/bin/env
          # Install the default/latest stable version
          aikup
          aiken --version

      - name: Cache Aiken dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.aiken
            ${{ matrix.example }}/onchain/aiken/build
          key: aiken-${{ matrix.example }}-${{ hashFiles(format('{0}/onchain/aiken/aiken.toml', matrix.example)) }}

      - name: Run aiken check and build
        working-directory: ${{ matrix.example }}/onchain/aiken
        run: |
          export PATH="$HOME/.aiken/bin:$PATH"
          aiken check
          aiken build

      - name: Verify plutus.json generated
        run: |
          if [ ! -f "${{ matrix.example }}/onchain/aiken/plutus.json" ]; then
            echo "plutus.json not generated"
            exit 1
          fi
          echo "plutus.json generated ($(wc -c < ${{ matrix.example }}/onchain/aiken/plutus.json) bytes)"

      - name: Upload plutus.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/plutus.json
          retention-days: 1

  test-ccl-java:
    name: Test CCL Java - ${{ matrix.example }}
    needs: [discover, compile-aiken]
    if: needs.discover.outputs.ccl-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.ccl-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Install JBang
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> $GITHUB_PATH

      - name: Verify JBang installation
        run: jbang version

      - name: Cache JBang dependencies
        uses: actions/cache@v4
        with:
          path: ~/.jbang/cache
          key: jbang-${{ matrix.example }}-${{ hashFiles(format('{0}/offchain/ccl-java/*.java', matrix.example)) }}

      - name: Setup Node.js (for Yaci DevKit)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Start Yaci DevKit
        run: |
          npm install -g @bloxbean/yaci-devkit
          nohup yaci-devkit up --enable-yaci-store > yaci-devkit.log 2>&1 &

      - name: Wait for Yaci DevKit
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Yaci DevKit ready"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run CCL Java test
        working-directory: ${{ matrix.example }}/offchain/ccl-java
        run: |
          set -o pipefail
          JAVA_FILE=$(ls *.java | head -1)
          echo "Running: jbang $JAVA_FILE"
          timeout 300 jbang "$JAVA_FILE" | tee test-output.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ccl-${{ matrix.example }}
          path: ${{ matrix.example }}/offchain/ccl-java/test-output.log
          retention-days: 30

  test-mesh:
    name: Test Mesh.js - ${{ matrix.example }}
    needs: [discover, compile-aiken]
    if: needs.discover.outputs.mesh-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.mesh-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ matrix.example }}-${{ hashFiles(format('{0}/offchain/meshjs/deno.json', matrix.example)) }}

      - name: Setup Node.js (for Yaci DevKit)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Start Yaci DevKit
        run: |
          npm install -g @bloxbean/yaci-devkit
          nohup yaci-devkit up --enable-yaci-store > yaci-devkit.log 2>&1 &

      - name: Wait for Yaci DevKit
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Yaci DevKit ready"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run Mesh.js test
        working-directory: ${{ matrix.example }}/offchain/meshjs
        run: |
          set -o pipefail
          TS_FILE=$(ls *.ts | head -1)
          echo "Running: deno run --allow-all $TS_FILE"
          timeout 300 deno run --allow-all "$TS_FILE" | tee test-output.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-mesh-${{ matrix.example }}
          path: ${{ matrix.example }}/offchain/meshjs/test-output.log
          retention-days: 30

  test-lucid:
    name: Test Lucid Evolution - ${{ matrix.example }}
    needs: [discover, compile-aiken]
    if: needs.discover.outputs.lucid-examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.lucid-examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js (for Yaci DevKit)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Start Yaci DevKit
        run: |
          npm install -g @bloxbean/yaci-devkit
          nohup yaci-devkit up --enable-yaci-store > yaci-devkit.log 2>&1 &

      - name: Wait for Yaci DevKit
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Yaci DevKit ready"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run Lucid Evolution test
        working-directory: ${{ matrix.example }}/offchain/lucid-evolution
        run: |
          set -o pipefail
          TS_FILE=$(ls *.ts | head -1)
          timeout 300 deno run --allow-all "$TS_FILE" | tee test-output.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-lucid-${{ matrix.example }}
          path: ${{ matrix.example }}/offchain/lucid-evolution/test-output.log
          retention-days: 30

  version-check-and-dashboard:
    name: Version Check & Dashboard
    needs: [compile-aiken, test-ccl-java, test-mesh, test-lucid]
    if: always()   # run even if tests failed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Reconstruct status files from artifacts
        run: |
          mkdir -p .local-test-results

          # Aiken: presence of plutus.json = success
          for d in artifacts/plutus-*/; do
            [ -d "$d" ] || continue
            example=$(basename "$d" | sed 's/^plutus-//')
            if [ -f "$d/plutus.json" ]; then
              echo "success" > ".local-test-results/aiken-${example}-status.txt"
            else
              echo "failed" > ".local-test-results/aiken-${example}-status.txt"
            fi
          done

          # CCL Java: check log content for errors
          for d in artifacts/logs-ccl-*/; do
            [ -d "$d" ] || continue
            example=$(basename "$d" | sed 's/^logs-ccl-//')
            if [ -f "$d/test-output.log" ]; then
              if grep -qiE "AssertionError|BUILD FAILED|Exception in thread" "$d/test-output.log" 2>/dev/null; then
                echo "failed" > ".local-test-results/ccl-${example}-status.txt"
              else
                echo "success" > ".local-test-results/ccl-${example}-status.txt"
              fi
            else
              echo "failed" > ".local-test-results/ccl-${example}-status.txt"
            fi
          done

          # Mesh.js: check log content for Deno-specific failure patterns
          for d in artifacts/logs-mesh-*/; do
            [ -d "$d" ] || continue
            example=$(basename "$d" | sed 's/^logs-mesh-//')
            if [ -f "$d/test-output.log" ]; then
              if grep -qE "Uncaught|AssertionError|TypeError:|ReferenceError:|SyntaxError:|Error:" "$d/test-output.log" 2>/dev/null; then
                echo "failed" > ".local-test-results/mesh-${example}-status.txt"
              else
                echo "success" > ".local-test-results/mesh-${example}-status.txt"
              fi
            else
              echo "failed" > ".local-test-results/mesh-${example}-status.txt"
            fi
          done

          # Lucid Evolution: check log content for Deno-specific failure patterns
          for d in artifacts/logs-lucid-*/; do
            [ -d "$d" ] || continue
            example=$(basename "$d" | sed 's/^logs-lucid-//')
            if [ -f "$d/test-output.log" ]; then
              if grep -qE "Uncaught|AssertionError|TypeError:|ReferenceError:|SyntaxError:|Error:" "$d/test-output.log" 2>/dev/null; then
                echo "failed" > ".local-test-results/lucid-${example}-status.txt"
              else
                echo "success" > ".local-test-results/lucid-${example}-status.txt"
              fi
            else
              echo "failed" > ".local-test-results/lucid-${example}-status.txt"
            fi
          done

      - name: Run version check
        run: bash scripts/check-library-versions.sh

      - name: Generate dashboard
        run: bash scripts/generate-dashboard.sh

      - name: Commit dashboard.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes to dashboard.json"
          else
            git commit -m "chore: update dashboard.json [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload version report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-report
          path: |
            .local-test-results/version-report.json
            .local-test-results/version-report.md
          retention-days: 30

      - name: Add version report to job summary
        if: always()
        run: |
          if [ -f .local-test-results/version-report.md ]; then
            cat .local-test-results/version-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Apply version sync for PR
        if: env.VERSIONS_OUTDATED == 'true'
        run: bash scripts/sync-versions.sh

      - name: Create version-bump PR
        if: env.VERSIONS_OUTDATED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/version-bump
          delete-branch: true
          title: "chore: update library versions to latest"
          labels: ${{ env.VERSION_BUMP_LABEL }}
          body: |
            ## Automated Version Bump

            The nightly version check detected outdated libraries.
            This PR updates all dependency files to the latest versions.

            See the `version-report` artifact from the nightly workflow run for details.

            ---
            _Generated by the nightly ecosystem health check workflow_
          commit-message: "chore: bump library versions to latest"
