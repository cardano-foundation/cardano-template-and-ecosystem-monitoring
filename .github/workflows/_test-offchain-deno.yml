name: Test off-chain (Deno-based, reusable)

# Reusable workflow used by every Deno-based off-chain framework (Mesh.js,
# Evolution SDK, …). The caller supplies the framework id, the on-disk
# subdir, the matrix of examples, and the status prefix used for log
# artifacts (consumed by report-and-dashboard).

on:
  workflow_call:
    inputs:
      framework-id:
        description: 'Identifier matching frameworks.json (e.g. meshjs, evolutionsdk).'
        type: string
        required: true
      status-prefix:
        description: 'Short prefix used in the log/status artifact names (e.g. mesh, evosdk).'
        type: string
        required: true
      subdir:
        description: 'Path under the example dir containing the deno.json entrypoint.'
        type: string
        required: true
      examples:
        description: 'JSON array of example names to run.'
        type: string
        required: true
      cache-version:
        description: 'Cache-buster forwarded to setup-* actions.'
        type: string
        required: false
        default: 'v1'

jobs:
  test:
    name: Test ${{ inputs.framework-id }} - ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: ./.github/actions/setup-deno
        with:
          example: ${{ matrix.example }}
          subdir: ${{ inputs.subdir }}

      - name: Setup Yaci DevKit
        uses: ./.github/actions/setup-yaci-devkit
        with:
          cache-version: ${{ inputs.cache-version }}

      - name: Download plutus.json artifact
        uses: actions/download-artifact@v4
        with:
          name: plutus-${{ matrix.example }}
          path: ${{ matrix.example }}/onchain/aiken/

      - name: Run off-chain test
        working-directory: ${{ matrix.example }}/${{ inputs.subdir }}
        env:
          EXAMPLE: ${{ matrix.example }}
          SUBDIR: ${{ inputs.subdir }}
        run: |
          TS_FILE=$(ls *.ts | head -1)
          # Retry once with a 15s pause. Yaci's readiness probe covers the
          # bulk of startup flake, but tx submission can still hit short-lived
          # mempool/indexer gaps. test-output.log captures the last attempt's
          # output so the dashboard reflects the result we report.
          EXIT=1
          for ATTEMPT in 1 2; do
            echo "Running deno on $EXAMPLE/$SUBDIR/$TS_FILE (attempt $ATTEMPT/2)"
            set +e
            timeout 300 deno run --allow-all "$TS_FILE" 2>&1 | tee test-output.log
            EXIT=${PIPESTATUS[0]}
            set -e
            if [ "$EXIT" -eq 0 ]; then break; fi
            if [ "$ATTEMPT" -eq 1 ]; then
              echo "::warning::$EXAMPLE attempt $ATTEMPT failed with exit $EXIT — retrying after 15s"
              sleep 15
            fi
          done
          if [ "$EXIT" -eq 0 ]; then echo success > test-status.txt; else echo failed > test-status.txt; fi
          exit "$EXIT"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.status-prefix }}-${{ matrix.example }}
          path: |
            ${{ matrix.example }}/${{ inputs.subdir }}/test-output.log
            ${{ matrix.example }}/${{ inputs.subdir }}/test-status.txt
          retention-days: 30
