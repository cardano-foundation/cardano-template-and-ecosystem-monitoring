# Use-case manifest for escrow
#
# Schema reference: docs/reference/example-manifest.md (lands in P1W2).
# Discovery: scripts/local-test-discovery.sh reads this file (and falls back
# to legacy filename heuristics for use cases without a manifest, until P1W2
# completes the migration).
#
# Keys under onchain: and offchain: are framework `manifest_key` values from
# the registry under frameworks/<name>.yml. A key referenced here without a
# matching descriptor is a CI error.

use_case: escrow
description: >-
  A two-party escrow contract: a depositor locks funds for a recipient under
  a deadline, with refund-after-deadline and release-on-completion paths.

onchain:
  aiken:
    path: onchain/aiken

offchain:
  meshjs:
    path: offchain/meshjs
    entry: escrow.ts
  lucid-evolution:
    path: offchain/lucid-evolution
    entry: escrow.ts
