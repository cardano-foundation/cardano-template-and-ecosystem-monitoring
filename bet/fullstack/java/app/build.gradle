plugins {
    // Adds the `run` task that executes App.main().
    id 'application'
}

ext {
    julcVersion = '0.1.0-pre16'
    cardanoClientLibVersion = '0.8.0-pre5'
}

repositories {
    mavenCentral()
}

dependencies {
    // julc compiles the validator from Java to Plutus V3 during javac.
    implementation "com.bloxbean.cardano:julc-stdlib:${julcVersion}"
    implementation "com.bloxbean.cardano:julc-ledger-api:${julcVersion}"
    annotationProcessor "com.bloxbean.cardano:julc-annotation-processor:${julcVersion}"

    // Off-chain: load the compiled script, then build and submit transactions.
    implementation "com.bloxbean.cardano:julc-cardano-client-lib:${julcVersion}"
    implementation "com.bloxbean.cardano:cardano-client-lib:${cardanoClientLibVersion}"
    implementation "com.bloxbean.cardano:cardano-client-backend-blockfrost:${cardanoClientLibVersion}"

    // Scripts are costed in-process rather than by ogmios, which translates slots without the
    // devkit's era offset and so disagrees with the node about when a deadline falls. The
    // evaluator lives in julc-cardano-client-lib above; these supply the VM it looks up at
    // runtime, and without them it fails with "No JulcVmProvider found".
    implementation "com.bloxbean.cardano:julc-vm:${julcVersion}"
    runtimeOnly "com.bloxbean.cardano:julc-vm-scalus:${julcVersion}"

    // No SLF4J binding on purpose. cardano-client-lib both logs and rethrows a failed script
    // evaluation, and the rethrow keeps the original exception as its cause — so the chain's
    // actual complaint reaches App.isRejected either way. A binding would only add a stack
    // trace per deliberate rejection, and this example asserts several.

    // Tests evaluate the compiled validator on a real Plutus VM — the same one the example now
    // costs its transactions with, inherited from the main source set above.
    testImplementation "com.bloxbean.cardano:julc-testkit:${julcVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'org.cardanofoundation.templates.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
