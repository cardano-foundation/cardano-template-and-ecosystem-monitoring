# versions.yml — single source of truth for tool and library versions
#
# Every CI install step reads from this file. Every framework descriptor
# under frameworks/<name>.yml references the uppercase keys below as
# environment variables (`${{ env.<KEY>_VERSION }}`) via the
# `.github/actions/load-versions/` composite action.
#
# Schema reference: docs/reference/versions-yml.md (lands in P1W2).
#
# When bumping a version:
#   1. Open a milestone branch off feat/ecosystem-monitoring-and-learning-enhancement.
#   2. Update the value here AND every place that references it (deno.json,
#      aiken.toml compiler=, JBang //DEPS lines, etc.).
#   3. Run the autonomous Codex review loop on the milestone diff.
#   4. Verify all CI cells stay green; document deliberate failures in the
#      milestone log.

# Cardano protocol era this repo currently targets. Era-tagged scenarios
# under <use-case>/conformance/scenarios/<era>/ must align with this value.
protocol_version: conway

# -- Onchain languages -------------------------------------------------------

# Aiken compiler. Each <use-case>/onchain/aiken/aiken.toml's `compiler =` field
# must match this value (CI sanity check enforces this in P1W2).
aiken: "1.1.17"

# -- Offchain SDKs -----------------------------------------------------------

# Mesh.js. Pinned to the version exercised by atomic-transaction (the most
# recent pilot example to land). Other pilot use cases that pre-date this
# version may need bumping in their deno.json during P1W2's caret sweep.
meshjs: "1.9.0-beta.95"

# Lucid Evolution. Drop carets in deno.json files (`@evolution-sdk/lucid@^2.0.1`
# becomes `@evolution-sdk/lucid@2.0.1`).
lucid_evolution: "2.0.1"

# Cardano Client Lib. Used by ccl-java examples through JBang //DEPS lines.
cardano_client_lib: "0.7.0-beta2"

# -- Test infrastructure -----------------------------------------------------

# Yaci DevKit (npm distribution). The Docker image bloxbean/yaci-devkit is not
# actively maintained (latest tag from April 2024); the npm package is the
# canonical, current distribution. See .codex-reviews/p1w1-yaci-poc.md.
yaci_devkit: "0.10.6"

# -- Toolchain ---------------------------------------------------------------

# JDK major version. JBang //JAVA lines and pom.xml/build.gradle must align.
jdk: "24"

# Node.js. Used to install yaci-devkit npm globally.
node: "20"

# Deno runtime for offchain TypeScript examples.
deno: "2.7.14"

# JBang launcher for ccl-java examples.
jbang: "0.138.0"
